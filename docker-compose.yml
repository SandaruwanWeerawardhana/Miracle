# Local development infrastructure.
#
#   docker compose up -d                 # postgres, redis, minio
#   docker compose --profile app up -d   # ... plus the API container
#
# Credentials here are for local development only.

name: miracle

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: miracle
      POSTGRES_PASSWORD: miracle
      POSTGRES_DB: miracle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the separate `miracle_test` database used by integration tests.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miracle -d miracle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: miracle
      MINIO_ROOT_PASSWORD: miracle-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 miracle miracle-secret; do sleep 1; done;
      mc mb --ignore-existing local/miracle-dev;
      mc anonymous set none local/miracle-dev;
      "

  api:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_API_DOCS_ENABLED: "true"
      LOG_FORMAT: pretty
      DATABASE_URL: postgres://miracle:miracle@postgres:5432/miracle
      DATABASE_RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-not-for-production-use
      FRONTEND_URL: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: miracle-dev
      S3_REGION: us-east-1
      S3_ACCESS_KEY: miracle
      S3_SECRET_KEY: miracle-secret
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
