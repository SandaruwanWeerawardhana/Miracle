[package]
name = "miracle_backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Miracle International - Integrated Global Trade & Business Solutions Platform (API)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "miracle_backend"
path = "src/main.rs"

[dependencies]
# HTTP
axum = { version = "0.8.9", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "catch-panic",
    "cors",
    "limit",
    "request-id",
    "sensitive-headers",
    "set-header",
    "timeout",
    "trace",
] }

# Runtime
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"

# Serialization & validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.21", features = ["derive"] }

# Persistence
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "derive",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "rust_decimal",
    "tls-rustls",
    "uuid",
] }
redis = { version = "1.7", default-features = false, features = ["connection-manager", "tokio-comp"] }

# Domain value types
uuid = { version = "1.26", features = ["serde", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }

# Security
argon2 = "0.6"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

# Errors
thiserror = "2"
anyhow = "1"

# Observability & configuration
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15"

# API documentation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
