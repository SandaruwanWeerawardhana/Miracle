name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: miracle
          POSTGRES_PASSWORD: miracle
          POSTGRES_DB: miracle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miracle"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (unit + API + database)
        env:
          # Test server only. `#[sqlx::test]` creates and drops a database per test.
          DATABASE_URL: postgres://miracle:miracle@localhost:5432/miracle_test
        run: cargo test --locked -- --include-ignored

      - name: Release build
        run: cargo build --release --locked
